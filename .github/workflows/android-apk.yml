name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificações (tsc + testes)
        run: npm run check

      - name: Build do app web
        run: npm run build

      - name: Adicionar plataforma Android (Capacitor)
        run: npx cap add android

      - name: Sincronizar assets do web
        run: npx cap sync android

      - name: Setup JDK 21 (exigido pelo Capacitor 8 / Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK (debug, assinado com a keystore de debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload do APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gestao-financeira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Anexar APK à Release (somente tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
